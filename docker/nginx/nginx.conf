# CRUDD — production nginx reverse proxy
#
# Topology:
#   Internet (HTTPS/WSS :443)
#     └─ nginx
#         ├─ /              → web (static, served locally)
#         ├─ /api/*         → Fastify API (port 3001)
#         └─ /socket.io/*   → Fastify Socket.IO gateway (port 3001)
#
# TLS certificates are mounted at runtime from the host.
# See docker-compose.prod.yml for volume mounts.
#
# HTTP (:80) always redirects to HTTPS.

# ---------------------------------------------------------------------------
# Upstreams
# ---------------------------------------------------------------------------

upstream api_backend {
    server api:3001;
    keepalive 32;
}

upstream web_frontend {
    server web:80;
    keepalive 16;
}

upstream admin_frontend {
    server admin:80;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME / Let's Encrypt challenge support (optional, uncomment if using certbot)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main player-facing app  (play.example.com)
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name play.example.com;

    # TLS — certificates are mounted from the host (see docker-compose.prod.yml)
    # Replace paths if using certbot/Let's Encrypt:
    #   /etc/letsencrypt/live/play.example.com/fullchain.pem
    #   /etc/letsencrypt/live/play.example.com/privkey.pem
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---------------------------------------------------------------------------
    # Socket.IO — WebSocket upgrade (must be before the /api block)
    # ---------------------------------------------------------------------------
    #
    # Socket.IO uses HTTP long-polling as a fallback, so we proxy ALL traffic
    # to /socket.io to the API rather than only the WS upgrade.  The upgrade
    # headers are set unconditionally so WS handshakes are handled correctly.
    #
    location /socket.io/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard forwarding headers
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Keep WebSocket connections alive for the match duration
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;

        # Disable buffering for real-time traffic
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------------
    # REST API
    # ---------------------------------------------------------------------------

    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---------------------------------------------------------------------------
    # React SPA (static files)
    # ---------------------------------------------------------------------------

    location / {
        proxy_pass         http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — admin dashboard  (admin.example.com)
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location / {
        proxy_pass         http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}

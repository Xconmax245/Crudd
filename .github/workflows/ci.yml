name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm turbo lint

    - name: Typecheck
      run: pnpm turbo typecheck

    # Runs every workspace `test` script (api + validation), not just the API.
    - name: Test
      run: pnpm turbo test

    # Catches build-only breakage (Vite/tsc project refs, Prisma client
    # generation) that lint + typecheck alone will not surface.
    - name: Build
      run: pnpm turbo build
